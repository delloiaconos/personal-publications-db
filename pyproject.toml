[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-publication-db"
version = "0.1.0"
description = "Personal publication database utility"
requires-python = ">=3.10"
dependencies = [
    "click",
    "requests",
]

[project.scripts]
ppubdb = "ppubdb:ppdb"

[tool.setuptools]
py-modules = ["ppubdb"]